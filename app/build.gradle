apply plugin: 'com.android.application'

android {
    namespace 'com.weleone.qishui'
    compileSdk 34

    defaultConfig {
        applicationId "com.weleone.qishui"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.0.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
